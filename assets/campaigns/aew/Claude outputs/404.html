<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — Naomi Schaefer</title>
<meta name="description" content="This page could not be found.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0b0b0c; --paper:#f7f6f4; --grey:#8f8f8f; --red:#d8463a;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px;
  }
  .code{
    font-family:'IBM Plex Mono',monospace; font-size:13px; letter-spacing:.16em;
    text-transform:uppercase; color:var(--red); margin-bottom:18px;
  }
  h1{
    font-family:'Fraunces',serif; font-weight:500; font-size:clamp(28px,5vw,44px);
    line-height:1.2; max-width:20ch; margin-bottom:16px;
  }
  p{ color:var(--grey); font-size:15px; max-width:34ch; margin-bottom:32px; }
  a.home{
    font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.06em;
    text-transform:uppercase; color:var(--ink); border:1px solid rgba(0,0,0,.14);
    padding:12px 26px; text-decoration:none; transition:all .25s ease;
  }
  a.home:hover{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
</style>
</head>
<body>
  <div class="code">404</div>
  <h1>This page doesn't exist.</h1>
  <p>The page you're looking for may have been moved or never existed. Let's get you back to the work.</p>
  <a class="home" href="/">Back to Portfolio</a>
</body>
</html>
